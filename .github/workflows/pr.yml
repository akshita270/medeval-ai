name: PR Checks

on:
  pull_request:
    branches: [main]

# Cancel a stale in-progress run when a new commit lands on the same PR --
# pure cost control: no point paying for an evaluation run that's about
# to be superseded.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, format check, unit tests (mocked API, no secrets needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate configuration loads
        run: python -c "from app.config import get_settings; get_settings()"

      - name: Type check
        run: mypy app scripts evaluation

      - name: Unit tests (deterministic + mocked API -- zero real API calls)
        run: python -m pytest tests/unit/ -v

  frontend:
    name: Frontend lint, type check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  evaluation:
    name: Sampled evaluation + quality gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    # GitHub Actions does not allow referencing `secrets` directly inside a
    # job-level `if:` (an "Unrecognized named-value: 'secrets'" parse error
    # -- this used to be here as `if: ${{ secrets.OPENAI_API_KEY != '' }}`
    # and silently broke this entire workflow file for every PR since
    # whenever that line was added). scripts/ci_quality_gate.py already
    # does the equivalent check correctly at runtime (`if not
    # settings.openai_api_key: ... skip cleanly`), so no job-level
    # condition is needed here at all -- GitHub itself still withholds the
    # real secret from fork PRs regardless, so OPENAI_API_KEY naturally
    # resolves to an empty string there and the script's own check handles
    # it the same way this used to try to.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build vector index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.build_index

      - name: Run sampled evaluation and apply quality gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.ci_quality_gate

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Lint, format check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: python -m pytest tests/unit/ -v

  full-evaluation:
    name: Full evaluation suite + quality gate
    runs-on: ubuntu-latest
    needs: test
    # Unlike the PR pipeline, a push to main always comes from someone
    # with write access to this repository, so the secret is always
    # available here -- there is no fork-PR case to guard against on
    # this trigger.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build vector index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.build_index

      - name: Run full evaluation and apply quality gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.ci_quality_gate --full

  deploy:
    name: Deploy (placeholder -- implemented in Phase 6)
    runs-on: ubuntu-latest
    needs: full-evaluation
    # "Deploy only approved changes": this job only runs at all because
    # it `needs: full-evaluation`, which already failed (and stopped the
    # pipeline here) if the quality gate didn't pass. There is nothing
    # that bypasses that gate to reach this job.
    steps:
      - name: Deployment not yet implemented
        run: |
          echo "AWS deployment (Elastic Beanstalk, no Docker) is Phase 6 of this project and is not yet built."
          echo "The quality gate above passing is what would authorize a real deploy step here."

  smoke-test:
    name: Post-deployment smoke test (placeholder -- implemented in Phase 6)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke test not yet implemented
        run: echo "Post-deployment smoke tests (hitting the live /health endpoint) are Phase 6 of this project."
